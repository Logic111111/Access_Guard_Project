<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="AccessGuard secure exam monitoring." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
    <title>AccessGuard | Secure Exam Monitoring</title>
    <script>
      window.addEventListener("error", function (event) {
        if (
          event.error instanceof DOMException &&
          event.error.name === "DataCloneError" &&
          event.message &&
          event.message.includes("PerformanceServerTiming")
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run AccessGuard.</noscript>
    <div id="root"></div>
  </body>
</html>
