# Public HTTPS on a single server with automatic Let's Encrypt certificates.
#
#   docker compose -f compose.yaml -f compose.https.yaml up -d
#
# Requires APP_DOMAIN and ACME_EMAIL in .env, a DNS A/AAAA record for
# APP_DOMAIN pointing at this server, and ports 80 and 443 open.
services:
  frontend:
    # Only Caddy is published; the app is reachable solely through HTTPS.
    ports: !reset []
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN in .env, e.g. exam.example.edu}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env for certificate notices}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
